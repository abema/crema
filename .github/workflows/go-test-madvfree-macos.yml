name: go-test-madvfree-macos

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "ext/madvfree/**"
  pull_request:
    paths:
      - "ext/madvfree/**"
  workflow_dispatch:

env:
  GOPRIVATE: "github.com/abema/crema"

jobs:
  go-test-madvfree-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25"
          - "1.26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: v1-${{ runner.os }}-go-test-madvfree-${{ matrix.go-version }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: |
            v1-${{ runner.os }}-go-test-madvfree-${{ matrix.go-version }}-
      - name: setup-git
        run: git config --global url."https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/abema/crema".insteadOf "https://github.com/abema/crema"
      - name: Go test (madvfree, darwin backend)
        run: go test -race -v ./ext/madvfree/... ./ext/madvfree/bench/...
